services:
  web:
    image: php:8.4-cli@sha256:7e7413ed31b8c42b31c939cc83b3758b1cd618f7bf3803f5a0c39f98d4adcbee
    user: "${GRAPHONLINE_UID:-1000}:${GRAPHONLINE_GID:-1000}"
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "127.0.0.1:${GRAPHONLINE_PORT:-8080}:8080"
    command: php -d short_open_tag=On -S 0.0.0.0:8080 -t . tools/router.php
